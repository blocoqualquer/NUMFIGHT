name: build
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    container: ps2dev/ps2dev:latest
    steps:
      - uses: actions/checkout@v4
      - name: Compilar
        shell: sh
        run: |
          apk add --no-cache make
          export PATH="$PATH:$PS2DEV/bin:$PS2DEV/ee/bin"
          make
      - uses: actions/upload-artifact@v4
        with:
          name: NUMFIGHT
          path: NUMFIGHT.ELF
