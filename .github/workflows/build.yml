name: build
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    container: ps2dev/ps2dev:latest
    steps:
      - uses: actions/checkout@v4
      - run: make
        shell: sh
      - uses: actions/upload-artifact@v4
        with:
          name: NUMFIGHT
          path: NUMFIGHT.ELF
